[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-bridge"
version = "0.1.2"
description = "Explicit, verifiable task handoff between devices and independent coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "platformdirs>=4,<5", "keyring>=25,<26",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.12,<7", "psutil>=6,<8", "PySide6>=6.8,<7", "PyYAML>=6,<7"]

[project.scripts]
codex-bridge = "codex_bridge.main:main"
agent-bridge = "codex_bridge.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["large: actual 512 MiB network transfer (opt in)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
