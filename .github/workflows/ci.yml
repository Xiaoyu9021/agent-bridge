name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/build_skill.py --check
      - run: python -m ruff check .
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
      - run: python scripts/check_publish_tree.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/tests.xml
  skill-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/build_skill.py --check
      - run: python scripts/build_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bridge-skill
          if-no-files-found: error
          path: |
            artifacts/agent-bridge-skill.zip
            artifacts/agent-bridge-mac-skill.zip
            artifacts/skill-checksums.json
            artifacts/SHA256SUMS.txt
